<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Dialed password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #0b0a12;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    ">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #0b0a12; padding: 40px 16px">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 440px;
              background: #17151f;
              border: 1px solid #2a2735;
              border-radius: 24px;
              padding: 36px 28px;
            ">
            <tr>
              <td style="color: #ff4d8d; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">
                Dialed
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 20px;
                  color: #f5f3ff;
                  font-size: 22px;
                  font-weight: 700;
                  line-height: 1.3;
                ">
                Let's get you back in.
              </td>
            </tr>
            <tr>
              <td style="padding-top: 8px; color: #a09cb8; font-size: 15px; line-height: 1.5">
                Type this code into the app to choose a new password:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 28px 0">
                <div
                  style="
                    display: inline-block;
                    background: #0b0a12;
                    border: 1px solid #ff4d8d;
                    border-radius: 16px;
                    padding: 16px 24px;
                    color: #f5f3ff;
                    font-size: 34px;
                    font-weight: 800;
                    letter-spacing: 10px;
                    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
                  ">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="color: #a09cb8; font-size: 13px; line-height: 1.5">
                The code expires in 15 minutes. If you didn't ask to reset your password, you can
                ignore this email. Your password won't change.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
